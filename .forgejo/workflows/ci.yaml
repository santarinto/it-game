# Forgejo Actions — it-game tests + deploy (MINIPC-206, the platform chain:
# minipc MINIPC-164 / sntbot MINIPC-209 pattern).
#
# Tests run on the aiserver docker runner (aiserver-test, label minipc-test —
# home to them since LM-200; the first home ci-cd-srv is gone since 15.10,
# MINIPC-255) on EVERY push (any branch). The deploy job runs on the minipc
# HOST runner (label minipc-deploy): git.lan is unreachable from the game
# box (the home perimeter admits no public inbound), so the job FEEDS the
# commit to the box as a git bundle (forced command deploy-feed-bundle on
# each checkout) and then is ONE ssh line per target — stage first, prod
# after — to the loader on the game box 90.156.129.221 (MINIPC-256, the
# re-home after ci-cd-srv died): forced command deploy-project itgame-stage
# / itgame, transient user unit, recipe tools/deploy (contract v1) from the
# deployed SHA.
#
# Checkout is a plain git fetch with the job token, NOT actions/checkout:
# node-free where possible, and this runner serves no v4 artifact API
# (minipc recipe note, MINIPC-164). The aiserver runner resolves
# git.lan by LAN DNS (the public santarinto.com zone, MINIPC-198).
#
# Every job checks out the SHA the deploy ships (ITGAME-105): `inputs.ref`
# on «Run workflow», else github.sha — `git fetch --depth 1 origin <sha>`
# (Forgejo allows a want by sha). Until 105 the tests cloned the branch HEAD
# by name while the deploy shipped github.sha, and a second quick push made
# them differ: an untested commit could reach prod.
#
# Concurrency (ITGAME-105): one run per ref at a time. Without a
# `concurrency` block Forgejo (v16 docs; the box runs 16.0.5) cancels the
# older run of a push on every new push — on main that could cut a deploy
# between stage and prod. On main the runs now queue (cancel-in-progress
# false: each finishes, in push order, so prod ends on the last green push
# and an older run can't land after a newer one); other branches keep
# cancelling — they only test.
#
# Rollback (mode=rollback) does not build, so the test jobs skip their steps
# and pass: a red branch head no longer blocks it. It needs an explicit
# `ref`, and a stage that no longer holds the release (each target prunes
# its own KEEP=3) does not stop the prod rollback — the job fails after both.
#
# Server tests need PostgreSQL (parity with the retired GitHub CI): the
# service container is reachable by the service name `postgres`.
#
# Observability (MINIPC-78/87 parity): every job reports start/finish via
# tools/ci-notify.sh (vendored from the minipc repo, OBS_PROJECT=itgame);
# finish-unless-done in an always()-tail separates "failed" from "never ran".
# Without OBS_TOKEN the script is a silent no-op.
#
# DEPLOY_ENABLED is the CT1 latch, "0" until the owner's word: the deploy
# job then reports the skip and finishes GREEN (tests prove themselves, both
# targets stay untouched). The first live deploy flipped it to 1 (e3ea574,
# 08.10). Back to 0 since 16.10 (ci-cd-srv died, MINIPC-255 / ITGAME-128).
# The new chain (box 90.156.129.221, bundle feed, MINIPC-256) is built and
# a live stage build has run on the box; the flip back to 1 waits for DNS —
# the recipe's health check hits the public vhost URL, red until
# itgame.santarinto.ru points at the new box and LE certs are issued.
name: ci
on:
  push:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy | rollback"
        required: false
        default: "deploy"
      ref:
        description: "SHA (40 hex), default: the pushed commit"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
  DEPLOY_ENABLED: "0"

jobs:
  test-server:
    runs-on: minipc-test
    container: golang:1.26
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: itd
          POSTGRES_PASSWORD: itd
          POSTGRES_DB: itdirector_test
    env:
      TEST_DATABASE_URL: postgres://itd:itd@postgres:5432/itdirector_test
    steps:
      - if: inputs.mode == 'rollback'
        run: echo "rollback не собирает — test-server пропущен, релиз проверялся при своём деплое"
      - if: inputs.mode != 'rollback'
        env:
          SHA: "${{ inputs.ref || github.sha }}"
        run: |
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "bad ref: $SHA"; exit 1; }
          git init -q . && git fetch -q --depth 1 "https://x-access-token:${{ github.token }}@git.lan.santarinto.com/${GITHUB_REPOSITORY}.git" "$SHA" && git checkout -q --detach FETCH_HEAD
      - if: inputs.mode != 'rollback'
        run: |
          sh tools/ci-notify.sh test-server start || true
          cd server && go test ./...
          sh ../tools/ci-notify.sh test-server finish success || true
      - if: always() && inputs.mode != 'rollback'
        run: sh tools/ci-notify.sh test-server finish-unless-done || true

  test-client:
    runs-on: minipc-test
    container: node:22
    steps:
      - if: inputs.mode == 'rollback'
        run: echo "rollback не собирает — test-client пропущен, релиз проверялся при своём деплое"
      - if: inputs.mode != 'rollback'
        env:
          SHA: "${{ inputs.ref || github.sha }}"
        run: |
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "bad ref: $SHA"; exit 1; }
          git init -q . && git fetch -q --depth 1 "https://x-access-token:${{ github.token }}@git.lan.santarinto.com/${GITHUB_REPOSITORY}.git" "$SHA" && git checkout -q --detach FETCH_HEAD
      - if: inputs.mode != 'rollback'
        run: |
          sh tools/ci-notify.sh test-client start || true
          cd client && npm ci --no-audit --no-fund && npm run build
          sh ../tools/ci-notify.sh test-client finish success || true
      - if: always() && inputs.mode != 'rollback'
        run: sh tools/ci-notify.sh test-client finish-unless-done || true

  deploy:
    runs-on: minipc-deploy
    needs: [test-server, test-client]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - env:
          SHA: "${{ inputs.ref || github.sha }}"
        run: |
          # Host runner, no container: tools/ci-notify.sh needs only POSIX sh
          # and curl. The checkout is REQUIRED (MINIPC-256): the deploy ships
          # the commit to the box as a git bundle built here — full main, so
          # both a deploy sha and any rollback ancestor ride in one bundle.
          set -eu
          rm -rf .git && git init -q . && git fetch -q "https://x-access-token:${{ github.token }}@git.lan.santarinto.com/${GITHUB_REPOSITORY}.git" +refs/heads/main:refs/heads/main
          git cat-file -e "${SHA}^{commit}" || { echo "sha $SHA не в main — раскатывать нечего"; exit 1; }
          git checkout -q -f --detach "$SHA"
      - env:
          REF: "${{ inputs.ref || github.sha }}"
          INPUT_REF: "${{ inputs.ref }}"
          MODE: "${{ inputs.mode || 'deploy' }}"
        run: |
          set -eu
          sh tools/ci-notify.sh deploy-job start || true
          if [ "${DEPLOY_ENABLED}" != "1" ]; then
            echo "DEPLOY_ENABLED != 1 — деплой не зовётся (CT1-защёлка, MINIPC-206). Тесты зелёные, stage и прод не тронуты."
            sh tools/ci-notify.sh deploy-job finish success || true
            exit 0
          fi
          printf '%s' "$REF"  | grep -Eq '^[0-9a-f]{40}$' || { echo "bad ref"; exit 1; }
          printf '%s' "$MODE" | grep -Eq '^(deploy|rollback)$' || { echo "bad mode"; exit 1; }
          # Feed the box first (MINIPC-256): the game box cannot fetch git.lan
          # (the home perimeter admits no public inbound), so the commit ships
          # as a bundle into each checkout's refs/remotes/origin/main — the
          # loader's own fetch then fails as a WARNING and its safety checks
          # run against these refs (the native emergency-bundle path,
          # MINIPC-157 F4). Both modes need it: a rollback sha must be known
          # to the checkout too. ssh eats the bundle from stdin; the forced
          # command deploy-feed-bundle on the box refuses anything that does
          # not chain onto the local history.
          git bundle create /tmp/itg.bndl main
          ssh -o BatchMode=yes deploy-itgame-stage-feed < /tmp/itg.bndl
          ssh -o BatchMode=yes deploy-itgame-feed < /tmp/itg.bndl
          if [ "$MODE" = rollback ]; then
            # Откат на голову ветки бессмыслен — sha отката называют явно.
            [ -n "$INPUT_REF" ] || { echo "rollback требует ref (sha40 релиза, который есть на цели)"; exit 1; }
            # Цели чистят релизы независимо (KEEP=3): стейдж без этого sha не
            # должен оставить прод на сломанном релизе. Оба отката — всегда,
            # джоб красный, если не удался хоть один.
            rc=0
            ssh -o BatchMode=yes deploy-itgame-stage rollback "$REF" || { echo "стейдж НЕ откатился на $REF — откатываю прод всё равно"; rc=1; }
            ssh -o BatchMode=yes deploy-itgame rollback "$REF" || { echo "прод НЕ откатился на $REF"; rc=1; }
            [ "$rc" = 0 ] || exit 1
          else
            ssh -o BatchMode=yes deploy-itgame-stage deploy "$REF"
            ssh -o BatchMode=yes deploy-itgame deploy "$REF"
          fi
          sh tools/ci-notify.sh deploy-job finish success || true
      - if: always()
        run: sh tools/ci-notify.sh deploy-job finish-unless-done || true
