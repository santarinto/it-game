<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Director</title>
    <style>
      /* Мобильный клиент (ITGAME-227): сюда уводит гейт index.html (ITGAME-161). Канвас Phaser
         занимает #app целиком (Scale.RESIZE), под ним — строка со ссылкой на десктопную версию. */
      @font-face {
        font-family: 'Departure Mono';
        src: url('/assets/fonts/DepartureMono-Regular.woff2') format('woff2');
        font-display: block;
      }
      @font-face {
        font-family: 'ITD Symbols';
        src: url('/assets/fonts/ITDSymbols-Regular.woff2') format('woff2');
        font-display: block;
        unicode-range: U+2302, U+23F8, U+25B6, U+2623, U+2713, U+2715-2717;
      }
      html, body { margin: 0; background: #1a1c2c; height: 100%; }
      /* 100dvh: в мобильном браузере 100vh выше видимой области на панель адреса. */
      body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; touch-action: manipulation; }
      #app { flex: 1 1 auto; min-height: 0; overflow: hidden; }
      #app canvas { display: block; }
      footer { padding: 8px 16px; text-align: center; }
      a {
        color: #41a6f6; font-family: 'Departure Mono', monospace; font-size: 14px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <footer><a id="open-desktop" href="/?desktop=1">Открыть десктопную версию</a></footer>
    <script type="module" src="/src/mobile/main.ts"></script>
  </body>
</html>
