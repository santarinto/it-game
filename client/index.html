<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Director</title>
    <style>
      html, body { margin: 0; background: #1a1c2c; height: 100%; }
      /* Центрирование канваса — флексом, не Phaser autoCenter (он про margin).
         safe center: канвас шире окна не прячет левый край, а скроллится. */
      #app {
        display: flex;
        justify-content: center;
        justify-content: safe center;
        align-items: flex-start;
        min-height: 100vh;
        box-sizing: border-box;
        padding-top: 8px;
        overflow-x: auto;
      }
      #app canvas { flex-shrink: 0; }
      #topbar { text-align: right; padding: 4px 16px; }
      #topbar a {
        display: inline-block;
        color: #41a6f6; font-family: monospace; font-size: 15px; text-decoration: none;
        background: #232640; border: 1px solid #3a3f5c; border-radius: 4px;
        padding: 4px 12px;
      }
      #topbar a:hover { background: #3b5dc9; color: #f4f4f4; }
    </style>
  </head>
  <body>
    <div id="topbar"><a href="/admin" target="_blank">Админка</a></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
